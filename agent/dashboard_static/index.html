<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PQC Agent — Optimization Console</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<canvas id="rain"></canvas>
<nav id="topbar">
  <div class="brand"><span class="dot" id="statedot"></span> PQC Optimization Agent</div>
  <div class="nav-right">
    <div class="tabs" id="theme-tabs">
      <span class="tab" data-theme="matrix">matrix</span>
      <span class="tab" data-theme="dark">dark</span>
      <span class="tab" data-theme="light">light</span>
    </div>
    <span id="clock" class="muted"></span>
  </div>
</nav>

<main>
  <section id="hero" class="card hero">
    <div class="hero-left">
      <div id="status-line">loading…</div>
      <div id="proc-pills" class="pills"></div>
    </div>
    <div class="hero-stats" id="hero-stats"></div>
  </section>

  <div class="tabs big" id="design-tabs"></div>

  <section class="card" id="board-card">
    <h2 id="board-title">Cores vs baseline <span class="muted">(WNS ns @ 200MHz OOC — right is better, 0 = met)</span></h2>
    <div id="board"></div>
    <div id="chipline" class="chipline"></div>
  </section>

  <section class="grid2">
    <div class="card">
      <h2>Cumulative timing gain <span class="muted">(accepted edits, ns)</span></h2>
      <svg id="trend" viewBox="0 0 600 140" preserveAspectRatio="none"></svg>
    </div>
    <div class="card">
      <h2>Live simulation <span class="muted" id="live-age"></span></h2>
      <pre id="live-tail" class="live">(no run log)</pre>
    </div>
  </section>

  <section id="filterbar">
    <input id="q" type="search" placeholder="Filter: block, strategy, verdict…  ( / to focus )">
    <div id="tier-pills" class="pills"></div>
    <div id="verdict-pills" class="pills"></div>
  </section>

  <section id="journey"></section>

  <details id="legend" class="card">
    <summary>Verdict reference</summary>
    <div id="legendbody"></div>
  </details>
</main>

<script src="/static/app.js"></script>
</body>
</html>
