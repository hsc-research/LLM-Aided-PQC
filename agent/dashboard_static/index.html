<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PQC Agent — Mission Control</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body data-theme="matrix">
<canvas id="rain"></canvas>
<div class="wrap">
  <header>
    <div class="brand">
      <span class="logo">▚</span>
      <div><h1>PQC AGENT</h1><div class="sub">LLM-aided PPA optimization — HQC · ML-DSA · Artix-7</div></div>
    </div>
    <div class="hdr-right">
      <div id="clock" class="clock"></div>
      <div class="themes">
        <button data-t="matrix" title="Matrix">◉</button>
        <button data-t="dark" title="Dark">◐</button>
        <button data-t="light" title="Light">○</button>
      </div>
    </div>
  </header>

  <section id="hero" class="hero"><div id="status" class="status">loading…</div>
    <div id="procs" class="procs"></div>
  </section>

  <section class="totals" id="totals"></section>

  <section class="grid2">
    <div class="panel"><h2>Design boards</h2>
      <div class="tabs" id="tabs"></div>
      <div id="board"></div>
    </div>
    <div class="col">
      <div class="panel"><h2>Minerva <span id="mrun" class="pill"></span></h2><div id="minerva"></div></div>
      <div class="panel"><h2>Learned rules <span id="rcount" class="pill"></span></h2><div id="rules" class="rules"></div></div>
    </div>
  </section>

  <section class="panel"><h2>Cumulative verified gain</h2><div id="trend"></div></section>
  <section class="panel"><h2>Per-block trajectories</h2><div id="traj" class="trajgrid"></div></section>

  <section class="panel"><h2>Attempt feed</h2>
    <div class="feedbar">
      <input id="q" placeholder="filter: block, strategy, verdict…">
      <div id="legend" class="legend"></div>
    </div>
    <div id="feed"></div>
  </section>
</div>

<div id="modal" class="modal hidden"><div class="modal-card">
  <button id="mclose" class="mclose">✕</button>
  <div id="mbody"></div>
</div></div>
<script src="/static/app.js"></script>
</body>
</html>
