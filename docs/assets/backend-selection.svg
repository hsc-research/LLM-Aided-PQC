<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="590" viewBox="0 0 1440 590" role="img" aria-label="User-selected ASIC synthesis with Genus and Synopsys Design Compiler"><defs><marker id="a-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#7353AC"/></marker><marker id="a-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#AB6D20"/></marker></defs><style>text{font-family:DejaVu Sans,Arial,sans-serif}</style><rect width="100%" height="100%" fill="white" rx="18"/><text x="40" y="47" font-size="28" font-weight="700" fill="#17324D">Choose the tool, not a different optimization policy</text><text x="40" y="79" font-size="17" fill="#516477">Explicit tool choice for fixed-period synthesis. Licensed site validation is required.</text><rect x="470" y="112" width="500" height="87" rx="12" fill="#EDF4FC" stroke="#2868AE" stroke-width="1.7"/><g transform="translate(492,133) scale(0.75)" fill="none" stroke="#2868AE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5,0 H20 L27,7 V29 H5 Z M20,0 V7 H27 M10,13 H22 M10,19 H22 M10,25 H18"/></g><text x="527" y="145" font-size="20" font-weight="700" fill="#2868AE">Shared design manifest</text><text x="494" y="174" font-size="16" fill="#516477">Top, ordered RTL, SDC, parameters, test scope</text><rect x="170" y="254" width="480" height="100" rx="12" fill="#FCF4E8" stroke="#AB6D20" stroke-width="1.7"/><g transform="translate(192,275) scale(0.75)" fill="none" stroke="#AB6D20" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="0" width="24" height="24" rx="3"/><rect x="8" y="6" width="12" height="12"/><path d="M7,-5 V0 M7,24 V29 M-3,4 H2 M26,4 H31"/><path d="M14,-5 V0 M14,24 V29 M-3,11 H2 M26,11 H31"/><path d="M21,-5 V0 M21,24 V29 M-3,18 H2 M26,18 H31"/></g><text x="227" y="287" font-size="20" font-weight="700" fill="#AB6D20">Cadence Genus adapter</text><text x="194" y="316" font-size="16" fill="#516477">Generated Tcl, ordered sources, .lib inputs.</text><rect x="790" y="254" width="480" height="100" rx="12" fill="#F3EEFA" stroke="#7353AC" stroke-width="1.7"/><g transform="translate(812,275) scale(0.75)" fill="none" stroke="#7353AC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="0" width="24" height="24" rx="3"/><rect x="8" y="6" width="12" height="12"/><path d="M7,-5 V0 M7,24 V29 M-3,4 H2 M26,4 H31"/><path d="M14,-5 V0 M14,24 V29 M-3,11 H2 M26,11 H31"/><path d="M21,-5 V0 M21,24 V29 M-3,18 H2 M26,18 H31"/></g><text x="847" y="287" font-size="20" font-weight="700" fill="#7353AC">Synopsys DC adapter</text><text x="814" y="316" font-size="16" fill="#516477">Generated Tcl, ordered sources, .db inputs.</text><path d="M590,199 V224 H410 V254" fill="none" stroke="#AB6D20" stroke-width="2.2" marker-end="url(#a-amber)"/><path d="M850,199 V224 H1030 V254" fill="none" stroke="#7353AC" stroke-width="2.2" marker-end="url(#a-purple)"/><rect x="380" y="411" width="680" height="110" rx="12" fill="#ECF7F1" stroke="#247C61" stroke-width="1.7"/><g transform="translate(402,432) scale(0.75)" fill="none" stroke="#247C61" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="15" cy="4" rx="14" ry="4"/><path d="M1,4 V26 C1,32 29,32 29,26 V4 M1,15 C1,21 29,21 29,15"/></g><text x="437" y="444" font-size="20" font-weight="700" fill="#247C61">Stage-tagged measurement record</text><text x="404" y="473" font-size="16" fill="#516477">Tool/version, units, timing, area, power, model, provenance.</text><text x="404" y="497" font-size="16" fill="#516477">Compare baseline and candidate within a matched configuration.</text><path d="M410,354 V385 H540 V411" fill="none" stroke="#AB6D20" stroke-width="2.2" marker-end="url(#a-amber)"/><path d="M1030,354 V385 H900 V411" fill="none" stroke="#7353AC" stroke-width="2.2" marker-end="url(#a-purple)"/></svg>
