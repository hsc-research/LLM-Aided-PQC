<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc"><title id="title">Optimize RTL and verify the full design</title><desc id="desc">Follow steps one to four clockwise: check and measure the baseline, propose a small RTL edit, test the candidate sources, and measure the full design again. Qualified improvements may be retained. Failed or exploratory changes roll back.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6Z" fill="#86703a"/></marker></defs><style>text{font-family:DejaVu Sans,Arial,sans-serif}</style><rect width="1200" height="980" rx="18" fill="#f4f3ef"/><rect width="1200" height="145" rx="18" fill="#171717"/><rect y="125" width="1200" height="20" fill="#171717"/><text x="40" y="40" fill="#f1b300" font-size="18" font-weight="700" letter-spacing="1.5">LLM-AIDED-PQC / TECHNICAL WORKFLOW</text><text x="40" y="86" fill="white" font-size="33" font-weight="700">Optimize RTL and verify the full design</text><text x="40" y="121" fill="#dededb" font-size="20">Conceptual flow • Qualify FPGA and ASIC separately.</text><rect x="40" y="180" width="530" height="215" rx="12" fill="white" stroke="#d3d1c9" stroke-width="2"/><rect x="64" y="200" width="48" height="36" rx="6" fill="#f1b300"/><text x="88" y="226" text-anchor="middle" fill="#171717" font-size="23" font-weight="700">01</text><text x="64" y="271" font-size="25" font-weight="700" fill="#171717">Check and measure the baseline</text><text x="64" y="306" font-size="21" fill="#4b4b47">Select a target and source profile</text><text x="64" y="337" font-size="21" fill="#4b4b47">Run functional tests</text><text x="64" y="368" font-size="21" fill="#4b4b47">Measure the complete design</text><rect x="630" y="180" width="530" height="215" rx="12" fill="white" stroke="#d3d1c9" stroke-width="2"/><rect x="654" y="200" width="48" height="36" rx="6" fill="#f1b300"/><text x="678" y="226" text-anchor="middle" fill="#171717" font-size="23" font-weight="700">02</text><text x="654" y="271" font-size="25" font-weight="700" fill="#171717">Propose a small RTL edit</text><text x="654" y="306" font-size="21" fill="#4b4b47">Read the worst timing paths</text><text x="654" y="337" font-size="21" fill="#4b4b47">Set edit limits and an API budget</text><text x="654" y="368" font-size="21" fill="#4b4b47">Use an isolated candidate copy</text><rect x="630" y="440" width="530" height="215" rx="12" fill="white" stroke="#d3d1c9" stroke-width="2"/><rect x="654" y="460" width="48" height="36" rx="6" fill="#f1b300"/><text x="678" y="486" text-anchor="middle" fill="#171717" font-size="23" font-weight="700">03</text><text x="654" y="531" font-size="25" font-weight="700" fill="#171717">Test the candidate sources</text><text x="654" y="566" font-size="21" fill="#4b4b47">Run the required RTL checks again</text><text x="654" y="597" font-size="21" fill="#4b4b47">Compare per-vector cycle counts</text><text x="654" y="628" font-size="21" fill="#4b4b47">Reject failed or unsafe edits</text><rect x="40" y="440" width="530" height="215" rx="12" fill="white" stroke="#d3d1c9" stroke-width="2"/><rect x="64" y="460" width="48" height="36" rx="6" fill="#f1b300"/><text x="88" y="486" text-anchor="middle" fill="#171717" font-size="23" font-weight="700">04</text><text x="64" y="531" font-size="25" font-weight="700" fill="#171717">Measure the full design again</text><text x="64" y="566" font-size="21" fill="#4b4b47">Use matching tools and constraints</text><text x="64" y="597" font-size="21" fill="#4b4b47">Compare timing, area and cycles</text><text x="64" y="628" font-size="21" fill="#4b4b47">Save source files and reports</text><g fill="none" stroke="#86703a" stroke-width="2.5" marker-end="url(#arrow)"><path d="M580 286 H619"/><path d="M895 405 V430"/><path d="M620 547 H581"/><path d="M305 665 V695"/></g><rect x="40" y="705" width="1120" height="150" rx="12" fill="#242424"/><text x="65" y="740" fill="#f1b300" font-size="21" font-weight="700">DECIDE WHAT TO KEEP</text><text x="65" y="780" fill="white" font-size="21">Qualified + improved</text><text x="65" y="819" fill="#dededb" font-size="21">Retain the candidate</text><text x="440" y="780" fill="white" font-size="21">Failed or no benefit</text><text x="440" y="819" fill="#dededb" font-size="21">Restore previous sources</text><text x="845" y="780" fill="white" font-size="21">Exploratory mode</text><text x="845" y="819" fill="#dededb" font-size="21">Provisional; roll back</text><text x="40" y="896" fill="#474743" font-size="20">FPGA: Vivado / LUTs, FFs, BRAMs, DSPs</text><text x="40" y="928" fill="#474743" font-size="20">ASIC: DC or Genus / mapped cells, libraries and corner</text><text x="40" y="964" fill="#65655f" font-size="18">Not implemented: autonomous ASIC editing or ASIC place-and-route.</text></svg>