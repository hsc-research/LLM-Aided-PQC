    .llmbox{fill:#f7f1fb;stroke:#703d99;stroke-width:2.8}
    .checker{fill:#f1f8f4;stroke:#1d7746;stroke-width:2.2}
    .decision{fill:#f4f5f7;stroke:#707780;stroke-width:2}
    .accept{fill:#edf7f1;stroke:#1d7746;stroke-width:2.2}
    .reject{fill:#fbefef;stroke:#b1302c;stroke-width:2.2}
    .memory{fill:#f8f3fb;stroke:#703d99;stroke-width:2.2}
    .title{font-size:27px;font-weight:700}
    .heading{font-size:25px;font-weight:700}
    .boxtitle{font-size:21px;font-weight:700}
    .body{font-size:18px;fill:#6b6f74}
    .small{font-size:16px;fill:#6b6f74}
    .green{fill:#145130}.purple{fill:#67388d}.blue{fill:#235eab}
    .amber{fill:#ae6f11}.red{fill:#952825}
    .flow{fill:none;stroke:#49515a;stroke-width:2.2;marker-end:url(#arrow-gray)}
    .evidence{fill:none;stroke:#235eab;stroke-width:2.4;marker-end:url(#arrow-blue)}
    .learn{fill:none;stroke:#703d99;stroke-width:2.2;stroke-dasharray:8 7;marker-end:url(#arrow-purple)}
    .pass{fill:none;stroke:#1d7746;stroke-width:2.5;marker-end:url(#arrow-green)}
    .fail{fill:none;stroke:#b1302c;stroke-width:2.4;stroke-dasharray:8 7;marker-end:url(#arrow-red)}
    .badge{fill:#eef3f8;stroke:#7d93ad;stroke-width:1.6}
    .badgegreen{fill:#edf5f0;stroke:#1d7746;stroke-width:1.6}
