</defs><rect x="40" y="20" width="1520" height="105" rx="12" class="top"/><circle cx="90" cy="72" r="25" class="badge"/><text x="90" y="72" text-anchor="middle" class="badgetext">RTL</text><text x="138" y="61" text-anchor="start" class="title">Shared PQC RTL: Examples - ML-DSA, HQC, and SLH-DSA</text><text x="138" y="91" text-anchor="start" class="body">arithmetic, sampling, control and memory interfaces</text><rect x="1025" y="31" width="515" height="83" rx="10" class="obligation"/><circle cx="1064" cy="72" r="24" class="badgegreen"/><text x="1064" y="72" text-anchor="middle" class="badgetextgreen">✓</text><text x="1106" y="61" text-anchor="start" class="heading green">Checks that must pass</text><text x="1106" y="83" text-anchor="start" class="body green"><tspan x="1106" dy="0">KAT, fixed cycle schedule, and</tspan><tspan x="1106" dy="20">interface consistency</tspan></text><rect x="45" y="145" width="285" height="430" rx="10" class="frame"/><rect x="355" y="145" width="875" height="875" rx="10" class="frame"/><rect x="1260" y="145" width="295" height="430" rx="10" class="frame"/><text x="794" y="181" text-anchor="middle" class="heading purple">Closed-loop RTL optimization agent</text><text x="20" y="365" text-anchor="middle" class="heading amber" transform="rotate(-90 20 365)">ASIC flow</text><text x="1583" y="365" text-anchor="middle" class="heading blue" transform="rotate(90 1583 365)">FPGA flow</text><rect x="65" y="185" width="245" height="78" rx="8" class="backend"/><circle cx="96" cy="224" r="19" class="badge"/><text x="96" y="224" text-anchor="middle" class="badgetext">LS</text><text x="131" y="217" text-anchor="start" class="boxtitle">Logic synthesis</text><text x="131" y="243" text-anchor="start" class="body">Genus, STA</text><rect x="65" y="285" width="245" height="78" rx="8" class="backend"/><circle cx="96" cy="324" r="19" class="badge"/><text x="96" y="324" text-anchor="middle" class="badgetext">PD</text><text x="131" y="317" text-anchor="start" class="boxtitle">Physical design</text><text x="131" y="343" text-anchor="start" class="body">place, CTS, route</text><rect x="65" y="385" width="245" height="78" rx="8" class="backend"/><circle cx="96" cy="424" r="19" class="badge"/><text x="96" y="424" text-anchor="middle" class="badgetext">R</text><text x="131" y="417" text-anchor="start" class="boxtitle">Signoff reports</text><text x="131" y="443" text-anchor="start" class="body">timing, area, power</text><rect x="65" y="485" width="245" height="78" rx="8" class="backend"/><circle cx="96" cy="524" r="19" class="badge"/><text x="96" y="524" text-anchor="middle" class="badgetext">G</text><text x="131" y="517" text-anchor="start" class="boxtitle">ASIC tape-out</text><text x="131" y="543" text-anchor="start" class="body">Layout (GDSII)</text><path d="M188 125V185" class="flow"/><path d="M188 263V285" class="flow"/><path d="M188 363V385" class="flow"/><path d="M188 463V485" class="flow"/><rect x="1280" y="185" width="245" height="78" rx="8" class="backend"/><circle cx="1311" cy="224" r="19" class="badge"/><text x="1311" y="224" text-anchor="middle" class="badgetext">RTL</text><text x="1346" y="217" text-anchor="start" class="boxtitle">RTL synthesis</text><text x="1346" y="243" text-anchor="start" class="body">Vivado or Quartus</text><rect x="1280" y="285" width="245" height="78" rx="8" class="backend"/><circle cx="1311" cy="324" r="19" class="badge"/><text x="1311" y="324" text-anchor="middle" class="badgetext">PR</text><text x="1346" y="317" text-anchor="start" class="boxtitle">Place and route</text><text x="1346" y="343" text-anchor="start" class="body">implementation</text><rect x="1280" y="385" width="245" height="78" rx="8" class="backend"/><circle cx="1311" cy="424" r="19" class="badge"/><text x="1311" y="424" text-anchor="middle" class="badgetext">R</text><text x="1346" y="417" text-anchor="start" class="boxtitle">Reports</text><text x="1346" y="443" text-anchor="start" class="body">timing, resources, power</text><rect x="1280" y="485" width="245" height="78" rx="8" class="backend"/><circle cx="1311" cy="524" r="19" class="badge"/><text x="1311" y="524" text-anchor="middle" class="badgetext">01</text><text x="1346" y="517" text-anchor="start" class="boxtitle">Bitstream</text><text x="1346" y="543" text-anchor="start" class="body">.bit and .sof</text><path d="M1402 125V185" class="flow"/><path d="M1402 263V285" class="flow"/><path d="M1402 363V385" class="flow"/><path d="M1402 463V485" class="flow"/><rect x="390" y="190" width="805" height="78" rx="8" class="agentbox"/><circle cx="420" cy="229.0" r="18" class="badge"/><text x="420" y="229.0" text-anchor="middle" class="badgetext">1</text><text x="458" y="221" text-anchor="start" class="boxtitle">1. Report Parser, Hierarchy Mapper</text><text x="458" y="246" text-anchor="start" class="body"><tspan x="458" dy="0">critical paths, fanout, routing, resources and power</tspan></text><rect x="400" y="285" width="390" height="95" rx="8" class="agentbox"/><circle cx="430" cy="332.5" r="18" class="badge"/><text x="430" y="332.5" text-anchor="middle" class="badgetext">2</text><text x="468" y="316" text-anchor="start" class="boxtitle">2. PPA Engine</text><text x="468" y="341" text-anchor="start" class="body"><tspan x="468" dy="0">normalize timing, area,</tspan><tspan x="468" dy="21">power and cycles</tspan></text><rect x="815" y="285" width="370" height="95" rx="8" class="agentbox"/><circle cx="845" cy="332.5" r="18" class="badge"/><text x="845" y="332.5" text-anchor="middle" class="badgetext">3</text><text x="883" y="316" text-anchor="start" class="boxtitle">3. Timing Analysis</text><text x="883" y="341" text-anchor="start" class="body"><tspan x="883" dy="0">cluster paths; classify</tspan><tspan x="883" dy="21">RTL versus backend</tspan></text><rect x="400" y="400" width="390" height="95" rx="8" class="agentbox"/><circle cx="430" cy="447.5" r="18" class="badge"/><text x="430" y="447.5" text-anchor="middle" class="badgetext">4</text><text x="468" y="431" text-anchor="start" class="boxtitle">4. PPA Target Selector</text><text x="468" y="456" text-anchor="start" class="body"><tspan x="468" dy="0">rank cones; abstain on</tspan><tspan x="468" dy="21">physical limits</tspan></text><rect x="815" y="400" width="370" height="95" rx="8" class="llmbox"/><circle cx="845" cy="447.5" r="18" class="badgepurple"/><text x="845" y="447.5" text-anchor="middle" class="badgetextpurple">5</text><text x="883" y="431" text-anchor="start" class="boxtitle purple">5. LLM Edit Planner</text><text x="883" y="456" text-anchor="start" class="body"><tspan x="883" dy="0">choose typed edit; identify</tspan><tspan x="883" dy="21">affected cone</tspan></text><rect x="390" y="515" width="805" height="78" rx="8" class="agentbox"/><circle cx="420" cy="554.0" r="18" class="badge"/><text x="420" y="554.0" text-anchor="middle" class="badgetext">6</text><text x="458" y="546" text-anchor="start" class="boxtitle">6. Deterministic RTL Transformation</text><text x="458" y="571" text-anchor="start" class="body"><tspan x="458" dy="0">verify hierarchy and source locations; apply typed patch; stage candidate RTL</tspan></text><rect x="390" y="610" width="805" height="78" rx="8" class="agentbox"/><circle cx="420" cy="649.0" r="18" class="badge"/><text x="420" y="649.0" text-anchor="middle" class="badgetext">7</text><text x="458" y="641" text-anchor="start" class="boxtitle">7. Build and Measurement Controller</text><text x="458" y="666" text-anchor="start" class="body"><tspan x="458" dy="0">run selected backend and checks; collect PPA and cycle deltas</tspan></text><path d="M793 268V285" class="flow"/><path d="M790 332H815" class="flow"/><path d="M1000 380V390Q1000 400 990 400H790" class="flow"/><path d="M790 448H815" class="flow"/><path d="M1000 495V515" class="flow"/><path d="M793 593V610" class="flow"/><path d="M310 224H390" class="evidence"/><path d="M1280 224H1195" class="evidence"/><path d="M310 424H380V448H400" class="learn"/><path d="M1280 424H1205V448H1185" class="learn"/><rect x="350" y="710" width="250" height="118" rx="8" class="checker"/><circle cx="381" cy="769" r="18" class="badgegreen"/><text x="381" y="769" text-anchor="middle" class="badgetextgreen">F</text><text x="488" y="736" text-anchor="middle" class="boxtitle green"><tspan x="488" dy="0">Functional</tspan><tspan x="488" dy="23">Verification</tspan></text><text x="488" y="790" text-anchor="middle" class="small"><tspan x="488" dy="0">compile, elaborate;</tspan><tspan x="488" dy="19">KAT or reference</tspan></text><rect x="675" y="710" width="250" height="118" rx="8" class="checker"/><circle cx="706" cy="769" r="18" class="badgegreen"/><text x="706" y="769" text-anchor="middle" class="badgetextgreen">CT</text><text x="813" y="736" text-anchor="middle" class="boxtitle green"><tspan x="813" dy="0">Constant-Time</tspan><tspan x="813" dy="23">Verification</tspan></text><text x="813" y="790" text-anchor="middle" class="small"><tspan x="813" dy="0">fixed cycles; control,</tspan><tspan x="813" dy="19">memory-access schedule</tspan></text><rect x="1000" y="710" width="250" height="118" rx="8" class="checker"/><circle cx="1031" cy="769" r="18" class="badgegreen"/><text x="1031" y="769" text-anchor="middle" class="badgetextgreen">PPA</text><text x="1138" y="736" text-anchor="middle" class="boxtitle green"><tspan x="1138" dy="0">Timing and PPA</tspan><tspan x="1138" dy="23">Evaluation</tspan></text><text x="1138" y="790" text-anchor="middle" class="small"><tspan x="1138" dy="0">WNS, TNS; area/resources,</tspan><tspan x="1138" dy="19">power</tspan></text><path d="M510 688V710" class="flow"/><path d="M793 688V710" class="flow"/><path d="M1080 688V710" class="flow"/><rect x="665" y="850" width="260" height="65" rx="8" class="decision"/><text x="795" y="877" text-anchor="middle" class="boxtitle"><tspan x="795" dy="0">Did all three</tspan><tspan x="795" dy="22">checks pass?</tspan></text><rect x="75" y="845" width="300" height="80" rx="8" class="reject"/><text x="225" y="867" text-anchor="middle" class="boxtitle red"><tspan x="225" dy="0">Revert candidate</tspan><tspan x="225" dy="21" class="body red">restore baseline</tspan><tspan x="225" dy="21" class="body red">and log the cause</tspan></text><rect x="1130" y="845" width="310" height="80" rx="8" class="accept"/><text x="1285" y="867" text-anchor="middle" class="boxtitle green"><tspan x="1285" dy="0">Accept candidate</tspan><tspan x="1285" dy="21" class="body green">use it as the new</tspan><tspan x="1285" dy="21" class="body green">RTL baseline</tspan></text><path d="M475 828V838H735V850" class="flow"/><path d="M800 828V850" class="flow"/><path d="M1125 828V838H855V850" class="flow"/><path d="M665 882H375" class="fail"/><text x="520" y="873" text-anchor="middle" class="label red">any check fails</text><path d="M925 882H1130" class="pass"/><text x="1027" y="873" text-anchor="middle" class="label green">all checks pass</text><rect x="390" y="960" width="805" height="60" rx="8" class="memory"/><circle cx="422" cy="990" r="17" class="badgepurple"/><text x="422" y="990" text-anchor="middle" class="badgetextpurple">DB</text><text x="455" y="987" text-anchor="start" class="boxtitle purple">Evidence, Token Cost, and Rule Memory</text><text x="455" y="1011" text-anchor="start" class="small">accepted, rejected, and abstained edits across PQC cores and backends</text><path d="M225 925V948Q225 960 237 960H390" class="fail"/><path d="M1285 925V948Q1285 960 1273 960H1195" class="pass"/><path d="M390 990H350V448H400" class="learn"/><path d="M1195 990H1235V448H1185" class="learn"/><path d="M1440 885H1570V72H1540" class="pass"/><text x="1548" y="330" text-anchor="middle" class="label green" transform="rotate(-90 1548 330)">accepted RTL</text></svg>