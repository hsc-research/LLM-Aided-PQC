<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
<title id="title">LLM-aided closed-loop RTL optimization framework for PQC hardware</title>
<desc id="desc">A shared PQC RTL baseline is analyzed by ASIC and FPGA flows. A seven-stage deterministic optimization controller uses an LLM only for typed edit planning, then independently checks functional behavior, constant-time schedules, and timing and PPA before accepting or reverting a candidate.</desc>
<defs>
  <marker id="arrow-gray" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5 0 10z" fill="#49515a"/></marker>
  <marker id="arrow-blue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5 0 10z" fill="#235eab"/></marker>
  <marker id="arrow-purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5 0 10z" fill="#703d99"/></marker>
  <marker id="arrow-green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5 0 10z" fill="#1d7746"/></marker>
  <marker id="arrow-red" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth"><path d="M0 0L10 5 0 10z" fill="#b1302c"/></marker>
  <style>
