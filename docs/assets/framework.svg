<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1040" viewBox="0 0 1440 1040" role="img" aria-label="Top-down RTL optimization and separate FPGA/ASIC measurement flows"><defs><marker id="a-blue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#2868AE"/></marker><marker id="a-purple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#7353AC"/></marker><marker id="a-green" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#247C61"/></marker><marker id="a-amber" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#AB6D20"/></marker><marker id="a-red" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#B24C53"/></marker><marker id="a-muted" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L6,3 L0,6 Z" fill="#516477"/></marker></defs><style>text{font-family:DejaVu Sans,Arial,sans-serif}</style><rect width="100%" height="100%" fill="white" rx="18"/><text x="42" y="47" font-size="29" font-weight="700" fill="#17324D">A top-down loop, with backend-specific evidence</text><text x="42" y="77" font-size="18" fill="#516477">Start with the integrated design. Use block-level analysis only when its critical paths justify it.</text><rect x="400" y="103" width="640" height="84" rx="12" fill="#EDF4FC" stroke="#2868AE" stroke-width="1.7"/><g transform="translate(422,124) scale(0.75)" fill="none" stroke="#2868AE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="0" width="24" height="24" rx="3"/><rect x="8" y="6" width="12" height="12"/><path d="M7,-5 V0 M7,24 V29 M-3,4 H2 M26,4 H31"/><path d="M14,-5 V0 M14,24 V29 M-3,11 H2 M26,11 H31"/><path d="M21,-5 V0 M21,24 V29 M-3,18 H2 M26,18 H31"/></g><text x="457" y="136" font-size="20" font-weight="700" fill="#2868AE">PQC RTL, configuration, and trusted baseline</text><text x="424" y="165" font-size="16" fill="#516477">ML-DSA/Dilithium  ·  HQC  ·  SLH-DSA/SPHINCSLET</text><rect x="40" y="214" width="330" height="374" rx="14" fill="#F4F7FB" stroke="#C7D4E0"/><text x="64" y="244" font-size="16" font-weight="700" fill="#2868AE">FPGA FLOW</text><rect x="1070" y="214" width="330" height="374" rx="14" fill="#F4F7FB" stroke="#C7D4E0"/><text x="1094" y="244" font-size="16" font-weight="700" fill="#AB6D20">ASIC FLOW</text><rect x="58" y="267" width="294" height="84" rx="12" fill="#EDF4FC" stroke="#2868AE" stroke-width="1.7"/><g transform="translate(80,288) scale(0.75)" fill="none" stroke="#2868AE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="0" width="24" height="24" rx="3"/><rect x="8" y="6" width="12" height="12"/><path d="M7,-5 V0 M7,24 V29 M-3,4 H2 M26,4 H31"/><path d="M14,-5 V0 M14,24 V29 M-3,11 H2 M26,11 H31"/><path d="M21,-5 V0 M21,24 V29 M-3,18 H2 M26,18 H31"/></g><text x="115" y="300" font-size="20" font-weight="700" fill="#2868AE">Vivado synthesis</text><text x="82" y="329" font-size="16" fill="#516477">Target device, RTL, constraints</text><rect x="58" y="378" width="294" height="83" rx="12" fill="#EDF4FC" stroke="#2868AE" stroke-width="1.7"/><g transform="translate(80,399) scale(0.75)" fill="none" stroke="#2868AE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0,2 H12 V16 H28 V30 M0,30 H8 V22 H19 V3 H29"/><circle cx="0" cy="2" r="2"/><circle cx="28" cy="30" r="2"/></g><text x="115" y="411" font-size="20" font-weight="700" fill="#2868AE">Place and route</text><text x="82" y="440" font-size="16" fill="#516477">Implementation and timing</text><rect x="58" y="488" width="294" height="80" rx="12" fill="#EDF4FC" stroke="#2868AE" stroke-width="1.7"/><g transform="translate(80,509) scale(0.75)" fill="none" stroke="#2868AE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5,0 H20 L27,7 V29 H5 Z M20,0 V7 H27 M10,13 H22 M10,19 H22 M10,25 H18"/></g><text x="115" y="521" font-size="20" font-weight="700" fill="#2868AE">Routed reports</text><text x="82" y="550" font-size="16" fill="#516477">Timing, resources, path details</text><rect x="1088" y="267" width="294" height="84" rx="12" fill="#FCF4E8" stroke="#AB6D20" stroke-width="1.7"/><g transform="translate(1110,288) scale(0.75)" fill="none" stroke="#AB6D20" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="0" width="24" height="24" rx="3"/><rect x="8" y="6" width="12" height="12"/><path d="M7,-5 V0 M7,24 V29 M-3,4 H2 M26,4 H31"/><path d="M14,-5 V0 M14,24 V29 M-3,11 H2 M26,11 H31"/><path d="M21,-5 V0 M21,24 V29 M-3,18 H2 M26,18 H31"/></g><text x="1145" y="300" font-size="20" font-weight="700" fill="#AB6D20">Genus / DC synthesis</text><text x="1112" y="329" font-size="16" fill="#516477">Fixed-period, pre-layout</text><rect x="1088" y="378" width="294" height="83" rx="12" fill="#FCF4E8" stroke="#AB6D20" stroke-width="1.7"/><g transform="translate(1110,399) scale(0.75)" fill="none" stroke="#AB6D20" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M0,2 H12 V16 H28 V30 M0,30 H8 V22 H19 V3 H29"/><circle cx="0" cy="2" r="2"/><circle cx="28" cy="30" r="2"/></g><text x="1145" y="411" font-size="20" font-weight="700" fill="#AB6D20">Mapped RTL netlist</text><text x="1112" y="440" font-size="16" fill="#516477">Libraries, corner, memory model</text><rect x="1088" y="488" width="294" height="80" rx="12" fill="#FCF4E8" stroke="#AB6D20" stroke-width="1.7"/><g transform="translate(1110,509) scale(0.75)" fill="none" stroke="#AB6D20" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5,0 H20 L27,7 V29 H5 Z M20,0 V7 H27 M10,13 H22 M10,19 H22 M10,25 H18"/></g><text x="1145" y="521" font-size="20" font-weight="700" fill="#AB6D20">Synthesis reports</text><text x="1112" y="550" font-size="16" fill="#516477">Timing, cells, area, power</text><path d="M520,187 V201 H205 V267" fill="none" stroke="#2868AE" stroke-width="2.2" marker-end="url(#a-blue)"/><path d="M920,187 V201 H1235 V267" fill="none" stroke="#AB6D20" stroke-width="2.2" marker-end="url(#a-amber)"/><path d="M205,351 V378" fill="none" stroke="#2868AE" stroke-width="2.2" marker-end="url(#a-blue)"/><path d="M205,461 V488" fill="none" stroke="#2868AE" stroke-width="2.2" marker-end="url(#a-blue)"/><path d="M1235,351 V378" fill="none" stroke="#AB6D20" stroke-width="2.2" marker-end="url(#a-amber)"/><path d="M1235,461 V488" fill="none" stroke="#AB6D20" stroke-width="2.2" marker-end="url(#a-amber)"/><rect x="410" y="271" width="620" height="110" rx="12" fill="#EDF4FC" stroke="#2868AE" stroke-width="1.7"/><g transform="translate(432,292) scale(0.75)" fill="none" stroke="#2868AE" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="11" r="10"/><path d="M19,19 L29,29 M6,14 L10,10 L14,12 L18,6"/></g><text x="467" y="304" font-size="20" font-weight="700" fill="#2868AE">1  Analyze the top-level timing evidence</text><text x="434" y="333" font-size="16" fill="#516477">Map reported paths to RTL and group related structures.</text><text x="434" y="357" font-size="16" fill="#516477">Inspect the responsible block only when needed.</text><path d="M352,529 H385 V326 H410" fill="none" stroke="#2868AE" stroke-width="2.2" marker-end="url(#a-blue)"/><path d="M1088,529 H1055 V326 H1030" fill="none" stroke="#AB6D20" stroke-width="2.2" marker-end="url(#a-amber)"/><rect x="410" y="419" width="620" height="110" rx="12" fill="#F3EEFA" stroke="#7353AC" stroke-width="1.7"/><g transform="translate(432,440) scale(0.75)" fill="none" stroke="#7353AC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M2,22 L2,29 L9,29 L29,9 L22,2 Z M18,6 L25,13 M2,22 L9,29"/></g><text x="467" y="452" font-size="20" font-weight="700" fill="#7353AC">2  Propose and apply a typed RTL edit</text><text x="434" y="481" font-size="16" fill="#516477">LLM selects a rule; deterministic code checks edit sites.</text><text x="434" y="505" font-size="16" fill="#516477">Unsupported structures: abstain or request rule review.</text><path d="M720,381 V419" fill="none" stroke="#2868AE" stroke-width="2.2" marker-end="url(#a-blue)"/><rect x="410" y="567" width="620" height="112" rx="12" fill="#ECF7F1" stroke="#247C61" stroke-width="1.7"/><g transform="translate(432,588) scale(0.75)" fill="none" stroke="#247C61" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15,0 L28,5 V16 Q27,25 15,31 Q3,25 2,16 V5 Z M7,14 L13,20 L23,9"/></g><text x="467" y="600" font-size="20" font-weight="700" fill="#247C61">3  Test the candidate, rebuild the full design</text><text x="434" y="629" font-size="16" fill="#516477">Run the design-specific KAT or differential test.</text><text x="434" y="653" font-size="16" fill="#516477">Record cycle evidence; remeasure in the same backend.</text><path d="M720,529 V567" fill="none" stroke="#7353AC" stroke-width="2.2" marker-end="url(#a-purple)"/><path d="M410,622 H205 V588" fill="none" stroke="#2868AE" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a-blue)"/><path d="M1030,622 H1235 V588" fill="none" stroke="#AB6D20" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a-amber)"/><text x="236" y="614" font-size="14" fill="#2868AE">rebuild</text><text x="1118" y="614" font-size="14" fill="#AB6D20">rebuild</text><rect x="410" y="721" width="620" height="77" rx="12" fill="#EDF4FC" stroke="#2868AE" stroke-width="1.7"/><text x="434" y="754" font-size="20" font-weight="700" fill="#2868AE">4  Compare against the recorded baseline</text><text x="434" y="783" font-size="16" fill="#516477">Check correctness scope, objective, and protected metrics.</text><path d="M720,679 V721" fill="none" stroke="#247C61" stroke-width="2.2" marker-end="url(#a-green)"/><rect x="100" y="833" width="340" height="87" rx="12" fill="#FBF0F1" stroke="#B24C53" stroke-width="1.7"/><text x="124" y="866" font-size="20" font-weight="700" fill="#B24C53">Reject or stop</text><text x="124" y="895" font-size="16" fill="#516477">Failed checks or insufficient benefit.</text><rect x="550" y="833" width="340" height="87" rx="12" fill="#ECF7F1" stroke="#247C61" stroke-width="1.7"/><text x="574" y="866" font-size="20" font-weight="700" fill="#247C61">Retain candidate</text><text x="574" y="895" font-size="16" fill="#516477">Integrated result improves.</text><rect x="1008" y="833" width="380" height="87" rx="12" fill="#F3EEFA" stroke="#7353AC" stroke-width="1.7"/><g transform="translate(1030,854) scale(0.75)" fill="none" stroke="#7353AC" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="15" cy="4" rx="14" ry="4"/><path d="M1,4 V26 C1,32 29,32 29,26 V4 M1,15 C1,21 29,21 29,15"/></g><text x="1065" y="866" font-size="20" font-weight="700" fill="#7353AC">Record the evidence</text><text x="1032" y="895" font-size="16" fill="#516477">Rules, failures, metrics, scope.</text><path d="M525,798 V815 H270 V833" fill="none" stroke="#B24C53" stroke-width="2.2" marker-end="url(#a-red)"/><path d="M720,798 V833" fill="none" stroke="#247C61" stroke-width="2.2" marker-end="url(#a-green)"/><path d="M440,887 H477 V946 H1198 V920" fill="none" stroke="#516477" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a-muted)"/><path d="M890,877 H1008" fill="none" stroke="#247C61" stroke-width="2.2" marker-end="url(#a-green)"/><path d="M1388,868 H1416 V198 H1020 V187" fill="none" stroke="#247C61" stroke-width="2.2" stroke-dasharray="7 5" marker-end="url(#a-green)"/><text x="1399" y="657" font-size="14" fill="#247C61" text-anchor="end">next iteration</text><text x="42" y="992" font-size="16" fill="#516477">ASIC currently measures candidates; autonomous ASIC editing and formal constant-time verification are not implemented.</text></svg>
